name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'users/**'
      - 'scripts/build_dashboard.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install fleet CLI
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise dashboard model and completion logic in Node
        run: node --test site/model.test.mjs tests/test_dashboard_completion.mjs

      - name: Validate driver-change ledger
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            shield-fleet ledger check --manifest "$manifest"
          done

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Include spatial UI preview at /test/
        shell: bash
        run: |
          set -euo pipefail
          # Pin the reviewed preview; production UI remains at the site root.
          preview_commit=a9f2359c2ff4d4e93e86082c47e5656edae01f6e
          git fetch --depth=1 origin "$preview_commit"
          mkdir -p site/test
          git archive "$preview_commit" site | tar -x --strip-components=1 -C site/test
          cp site/data.json site/test/data.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
