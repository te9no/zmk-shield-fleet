name: Fleet audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 20 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fleet repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install fleet CLI
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate driver-change ledger
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            shield-fleet ledger check --manifest "$manifest"
          done

      - name: Clone CI-managed repositories
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            profile="$(basename "$(dirname "$manifest")")"
            shield-fleet clone --manifest "$manifest" \
              --workspace ".fleet-workspace/$profile" --ci-only
          done

      - name: Audit repository contracts and drift
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            profile="$(basename "$(dirname "$manifest")")"
            shield-fleet audit --manifest "$manifest" \
              --workspace ".fleet-workspace/$profile" --ci-only
            shield-fleet revisions --manifest "$manifest" \
              --workspace ".fleet-workspace/$profile" --ci-only
          done
