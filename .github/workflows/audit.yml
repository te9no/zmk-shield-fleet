name: Fleet audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 20 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fleet repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install fleet CLI
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate driver-change ledger
        run: shield-fleet ledger check

      - name: Clone CI-managed repositories
        run: shield-fleet clone --workspace .fleet-workspace --ci-only

      - name: Audit repository contracts and drift
        run: shield-fleet audit --workspace .fleet-workspace --ci-only
