name: Fleet audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 20 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fleet repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install fleet CLI
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise dashboard model and completion logic in Node
        run: node --test site/model.test.mjs tests/test_dashboard_completion.mjs

      - name: Validate driver-change ledger
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            shield-fleet ledger check --manifest "$manifest"
          done

      - name: Compare remote PR and CI evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            shield-fleet ledger evidence --manifest "$manifest"
          done

      - name: Clone CI-managed repositories
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            profile="$(basename "$(dirname "$manifest")")"
            shield-fleet clone --manifest "$manifest" \
              --workspace ".fleet-workspace/$profile" --ci-only
          done

      - name: Audit repository contracts and drift
        shell: bash
        run: |
          set -euo pipefail
          for manifest in users/*/fleet.toml; do
            profile="$(basename "$(dirname "$manifest")")"
            shield-fleet audit --manifest "$manifest" \
              --workspace ".fleet-workspace/$profile" --ci-only
            baseline_args=()
            if [[ -f "$(dirname "$manifest")/changes/west-revision-pinning.json" ]]; then
              baseline_args=(--baseline-change west-revision-pinning)
            fi
            shield-fleet revisions --manifest "$manifest" \
              --workspace ".fleet-workspace/$profile" --ci-only --strict-sha \
              "${baseline_args[@]}"
          done
