[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmk-shield-fleet"
version = "0.1.0"
description = "Track and propagate shared ZMK changes across keyboard repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "te9no" }]
dependencies = []

[project.scripts]
shield-fleet = "zmk_shield_fleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
