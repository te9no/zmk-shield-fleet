checkout = "GeaconMopolia-zmk-config"
default_branch = "main"
maintenance_branch = "main"
architecture = "integrated-shield"
modules = ["magnetic-sensor"]
tags = ["6dof", "hid-joystick", "integrated", "right-hand-only", "xiao"]
required_globs = [
  "build.yaml",
  "config/west.yml",
  "boards/shields/geaconmopolia/geaconmopolia.overlay",
  "boards/shields/geaconmopolia/geaconmopolia.conf",
  "boards/shields/geaconmopolia/geaconmopolia.zmk.yml",
  "snippets/geacon-ipad-gamepad/snippet.yml",
]

[[repositories]]
id = "sparagmos"
rollout_enabled = false
allow_external = false
