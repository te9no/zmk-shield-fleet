[[mirrors]]
id = "mdk-mrm-slot-snippets"
description = "MDK and MRM began with the same three-slot module snippet set."
enforce = false
members = [
  { repository = "mdk", path = "snippets", include = ["Slot*/**"], exclude = [] },
  { repository = "mrm", path = "snippets", include = ["Slot*/**"], exclude = [] },
]
